      operationId: postV1Notes
      x-operation-id-source: derived
  /v1/notes/import/file:
    post:
      description: 'Create a new data entry (note) by importing a file from a publicly accessible URL. The entry must be associated with a project via `project_id`. Supported file types include documents (PDF, DOCX), audio files (MP3, WAV, M4A), and video files (MP4, MOV).


        **Note:** The notes resource has been renamed to **data** in Dovetail. New integrations should use **Import file to data** (`POST /v1/data/import/file`) instead.


        If the imported file is audio or video, Dovetail will automatically queue it for transcription. The resulting transcript will be added to the entry body once processing completes.


        Returns the newly created note object (without content).


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.


        > 🚧 Supported URLs

        >

        > The URL must use HTTPS and resolve to a public address; Dovetail rejects URLs that point to private, loopback, or link-local addresses. Only URLs that link directly to a downloadable file are supported. If the URL does not include a file extension, you must provide the `mime_type` parameter so Dovetail can determine how to process the file.


        > 🚧 Fields

        >

        > Only existing and unique fields can be referenced. This endpoint will not create new fields, or attempt to differentiate between duplicate field labels.


        > 📘 Transcription notifications

        >

        > When a transcription completes or fails, the account linked to the API token will receive a notification. You can manage notification preferences in notification settings.'
      summary: Import file to note
      tags:
      - Notes
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        description: The field's label (name). Must match an existing field label when updating, or will create a new field when creating.
                      value:
                        oneOf:
                        - type: string
                        - type: boolean
                        - type: number
                        - type: array
                          items:
                            type: string
                        description: 'The field''s value. Type depends on the field type: string for TEXT/EMAIL/URL/PHONE, boolean for BOOLEAN, number for NUMBER/NPS, string (ISO 8601) for DATETIME, string array for SELECT, or string (contact name) for PERSON. Null to clear the value.'
                      type:
                        type: string
                        enum:
                        - BOOLEAN
                        - DATETIME
                        - EMAIL
                        - NPS
                        - NUMBER
                        - PERSON
                        - PHONE
                        - SELECT
                        - TEXT
                        - URL
                        description: Include the desired type when creating a new field. If omitted or left empty, the field type defaults to TEXT. Do not include this property when referencing an existing field.
                    required:
                    - label
                    - value
                  description: The note's fields.
                mime_type:
                  type: string
                  description: The nature and format of file want to import.
                project_id:
                  type: string
                  description: Unique identifier of the project that the note is associated with.
                title:
                  type: string
                  description: The note's title.
                  example: My note
                url:
                  type: string
                  format: uri
                  description: Publicly accessible HTTPS url of the file that you want to import.
              required:
              - project_id
              - title
              - url
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                      type:
                        type: string
                        enum:
                        - note
                      title:
                        type: string
                      project:
                        type: object
                        properties:
                          id:
                            type: string
                          title:
                            type: string
                        required:
                        - id
                        - title
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                              description: The field's label (name). Must match an existing field label when updating, or will create a new field when creating.
                            value:
                              oneOf:
                              - type: string
                              - type: boolean
                              - type: number
                              - type: array
                                items:
                                  type: string
                              description: 'The field''s value. Type depends on the field type: string for TEXT/EMAIL/URL/PHONE, boolean for BOOLEAN, number for NUMBER/NPS, string (ISO 8601) for DATETIME, string array for SELECT, or string (contact name) for PERSON. Null to clear the value.'
                            type:
                              type: string
                              enum:
                              - BOOLEAN
                              - DATETIME
                              - EMAIL
                              - NPS
                              - NUMBER
                              - PERSON
                              - PHONE
                              - SELECT
                              - TEXT
                              - URL
                              description: Include the desired type when creating a new field. If omitted or left empty, the field type defaults to TEXT. Do not include this property when referencing an existing field.
                          required:
                          - label
                          - value
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the file.
                            name:
                              type: string
