openapi: 3.2.0
info:
  title: Dovetail Public Notes API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Notes
paths:
  /v1/notes:
    get:
      description: 'Retrieve all data entries (notes) in your workspace. These are documents within a project that capture raw research data such as interview transcripts, survey responses, and session recordings. They are the primary place where highlights and tags are applied.


        **Note:** The notes resource has been renamed to **data** in Dovetail. New integrations should use the equivalent **data** endpoints (`/v1/data`) instead, which provide the same functionality with additional features like title filtering.


        Results can be filtered by folder, project, or creation date. They can be sorted by creation date or title and are paginated.'
      summary: List notes
      tags:
      - Notes
      parameters:
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: filter
        in: query
        description: See [Filters](https://developers.dovetail.com/docs/filters) for details on parameter formatting.
        style: deepObject
        schema:
          type: object
          properties:
            created_at:
              type: object
              properties:
                gt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Great than operator
                gte:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Great than or equal to operator
                lt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Less than operator
                lte:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Less than or equal operator
              description: Filter results based on dates. When passing in operators, the operator pairs are mutually exclusive. For example, you cannot send both `gt` and `gte` in the same request.
            folder_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) of the associated folder(s)
            project_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) of the associated project(s)
          additionalProperties: false
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: created_at:desc
          oneOf:
          - type: string
            enum:
            - created_at:asc
            - created_at:desc
            - title:asc
            - title:desc
          - type: array
            items:
              type: string
              enum:
              - created_at:asc
              - created_at:desc
              - title:asc
              - title:desc
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type: string
                          description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                        type:
                          type: string
                          enum:
                          - note
                        title:
                          type: string
                        created_at:
                          type: string
                        deleted:
                          type: boolean
                        folder:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                          required:
                          - id
                      required:
                      - id
                      - type
                      - title
                      - created_at
                      - deleted
                      - folder
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
                    required:
                    - total_count
                    - has_more
                    - next_cursor
                required:
                - data
                - page
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - ValidationError
                        title:
                          type: string
                          enum:
                          - Contract violation
                        message:
                          type: string
                        path:
                          type: string
                      required:
                      - code
                      - title
                      - message
                      - path
                required:
                - errors
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - Unauthorized
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '403':
          description: '403'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - Forbidden
                          title:
                            type: string
                          message:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - IpNotAllowlisted
                          title:
                            type: string
                          message:
                            type: string
                          decisionId:
                            type: string
                            description: Correlation id quoting this enforcement decision — include it when contacting support.
                        required:
                        - code
                        - title
                        - decisionId
                required:
                - errors
        '404':
          description: '404'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - NotFound
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '422':
          description: '422'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - UnprocessableContent
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                      - message
                required:
                - errors
        '429':
          description: '429'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - TooManyRequests
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '500':
          description: '500'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - InternalError
                        title:
                          type: string
                          enum:
                          - Internal server error
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
      operationId: getV1Notes
      x-operation-id-source: derived
    post:
      description: 'Create a new data entry (note) within a Dovetail project. Data entries capture raw research data — interview transcripts, survey responses, or session recordings. They must be associated with a project via `project_id`.


        **Note:** The notes resource has been renamed to **data** in Dovetail. New integrations should use **Create data** (`POST /v1/data`) instead.


        You can provide the initial content as plain text or HTML via the `content` field, and attach custom field data via the `fields` array.


        Returns the note object without the content body.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create note
      tags:
      - Notes
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: The note's title.
                  example: My First Note
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        description: The field's label (name). Must match an existing field label when updating, or will create a new field when creating.
                      value:
                        oneOf:
                        - type: string
                        - type: boolean
                        - type: number
                        - type: array
                          items:
                            type: string
                        description: 'The field''s value. Type depends on the field type: string for TEXT/EMAIL/URL/PHONE, boolean for BOOLEAN, number for NUMBER/NPS, string (ISO 8601) for DATETIME, string array for SELECT, or string (contact name) for PERSON. Null to clear the value.'
                      type:
                        type: string
                        enum:
                        - BOOLEAN
                        - DATETIME
                        - EMAIL
                        - NPS
                        - NUMBER
                        - PERSON
                        - PHONE
                        - SELECT
                        - TEXT
                        - URL
                        description: Include the desired type when creating a new field. If omitted or left empty, the field type defaults to TEXT. Do not include this property when referencing an existing field.
                    required:
                    - label
                    - value
                  description: The note's fields.
                content:
                  type: string
                  maxLength: 100000
                  description: The initial content of the note, which may include plain text or HTML content.
                  example: This is my new note that will talk about the key learnings of the interview.
                project_id:
                  type: string
                  description: Unique identifier of the project that the note is associated with.
              required:
              - project_id
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                      type:
                        type: string
                        enum:
                        - note
                      title:
                        type: string
                      project:
                        type: object
                        properties:
                          id:
                            type: string
                          title:
                            type: string
                        required:
                        - id
                        - title
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                              description: The field's label (name). Must match an existing field label when updating, or will create a new field when creating.
                            value:
                              oneOf:
                              - type: string
                              - type: boolean
                              - type: number
                              - type: array
                                items:
                                  type: string
                              description: 'The field''s value. Type depends on the field type: string for TEXT/EMAIL/URL/PHONE, boolean for BOOLEAN, number for NUMBER/NPS, string (ISO 8601) for DATETIME, string array for SELECT, or string (contact name) for PERSON. Null to clear the value.'
                            type:
                              type: string
                              enum:
                              - BOOLEAN
                              - DATETIME
                              - EMAIL
                              - NPS
                              - NUMBER
                              - PERSON
                              - PHONE
                              - SELECT
                              - TEXT
                              - URL
                              description: Include the desired type when creating a new field. If omitted or left empty, the field type defaults to TEXT. Do not include this property when referencing an existing field.
                          required:
                          - label
                          - value
                      files:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the file.
                            name:
                              type: string
                              description: The file's original name.
                            type:
                              type:
                              - string
                              - 'null'
                              description: The file's MIME type (e.g. 'image/png', 'video/mp4'). Null if unknown.
                            size:
                              type:
                              - number
                              - 'null'
                              description: Size of the file in bytes. Null if unknown.
                            status:
                              type: string
                              enum:
                              - completed
                              - pending
                              - failed
                              description: Processing status of the file. 'pending' while being processed, 'completed' when ready, or 'failed' if processing encountered an error.
                            author:
                              oneOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - id
                              - type:
                                - string
                                - 'null'
                                format: 'null'
                              description: The user who uploaded the file, or null if the author is unknown.
                            created_at:
                              oneOf:
                              - type: string
                              - type:
                                - string
                                - 'null'
                                format: 'null'
                              description: ISO 8601 timestamp when the file was created.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Permanent URL pointing at the **Download a file** endpoint. Safe to cache and store — the URL itself never expires, but calling it requires the same authentication as other API endpoints and returns a short-lived presigned URL each time. The endpoint performs its own readiness and access checks.
                          required:
                          - id
                          - name
                          - type
                          - size
                          - status
                          - author
                          - created_at
                          - url
                      created_at:
                        type: string
                      deleted:
                        type: boolean
                      folder:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                        required:
                        - id
                    required:
                    - id
                    - type
                    - title
                    - project
                    - fields
                    - files
                    - created_at
                    - deleted
                    - folder
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - InvalidOperation
                          title:
                            type: string
                          message:
                            type: string
                          path:
                            type: string
                        required:
