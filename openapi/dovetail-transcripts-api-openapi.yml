  /v1/transcripts/{data_id}/utterance:
    post:
      description: 'Add a finalised utterance to a data entry''s transcript and broadcast it

        to connected clients. If the entry has no transcript, one is created

        automatically. Send finalised utterances only.'
      summary: Add utterance
      tags:
      - Transcripts
      parameters:
      - name: data_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the data entry.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                speaker_label:
                  type: string
                  minLength: 1
                  maxLength: 36
                  description: Speaker label for this utterance, such as "A" or "B".
                  example: A
                words:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                        minLength: 1
                      start:
                        type: number
                        minimum: 0
                        description: Word start time, in seconds, relative to the recording's start.
                      end:
                        type: number
                        minimum: 0
                        description: Word end time, in seconds, relative to the recording's start.
                    required:
                    - text
                    - start
                    - end
                  minItems: 1
                  maxItems: 1000
                  description: Finalised words in this utterance, in order. Word start/end timestamps are in seconds.
              required:
              - speaker_label
              - words
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      written:
                        type: number
                        description: Number of words saved.
                    required:
                    - written
                required:
                - data
        '400':
