openapi: 3.2.0
info:
  title: Dovetail Public Transcripts API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Transcripts
paths:
  /v1/transcripts/{data_id}:
    put:
      description: 'Create or replace a data entry''s live transcript by fetching a Recall

        async transcript JSON from `download_url`, mapping participant names

        to speaker labels, and writing the result in a single commit.

        Broadcasts the change to connected clients. A transcript with no

        usable speech writes a "no speech detected" transcript and returns

        200 with `written: 0`, so media can still be attached. Returns 400

        if the URL is unsafe, unreachable, or the payload cannot be read.

        Returns 409 if the transcript is already wrapped in an audio/video

        block (media has been attached).'
      summary: Set transcript from download URL
      tags:
      - Transcripts
      parameters:
      - name: data_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the data entry.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                download_url:
                  type: string
                  format: uri
                  description: HTTPS URL of a Recall async transcript JSON download (media_shortcuts.transcript data.download_url). The server fetches, maps speakers, and replaces the live transcript.
                  example: https://example.com/transcript.json
                join_url:
                  type: string
                  maxLength: 2048
                  format: uri
                  description: Optional HTTPS meeting join URL from the companion recording client (e.g. Zoom/Meet/Teams window URL). Used server-side to match a cached calendar meeting and link matching attendees to transcript speakers.
                  example: https://zoom.us/j/123456789
                recorded_at:
                  type: string
                  description: Optional ISO 8601 wall-clock time of the recording (e.g. when the companion session started). Used with `join_url` to match the correct near-term calendar meeting when the upload is delayed. When omitted, the server uses request arrival time.
                  example: '2026-08-17T03:00:00.000Z'
                video_download_url:
                  type: string
                  format: uri
                  description: Optional HTTPS URL of a Recall mixed MP4 download. Accepted for forward compatibility; the server does not download or attach video from this field yet.
                  example: https://example.com/video.mp4
              required:
              - download_url
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      written:
                        type: number
                        description: Total number of words saved across all utterances.
                    required:
                    - written
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
