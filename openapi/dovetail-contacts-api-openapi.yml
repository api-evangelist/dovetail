                        - BOOLEAN
                        - DATETIME
                        - EMAIL
                        - NPS
                        - NUMBER
                        - PERSON
                        - PHONE
                        - SELECT
                        - TEXT
                        - URL
                        description: Include the desired type when creating a new field. If omitted or left empty, the field type defaults to TEXT. Do not include this property when referencing an existing field.
                    required:
                    - label
                    - value
                  description: Custom field data for the contact (key-value pairs).
                  example:
                  - label: salesforce_id
                    value: 003XX000004TmiQQAS
              required:
              - name
              - email
