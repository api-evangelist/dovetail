openapi: 3.2.0
info:
  title: Dovetail Public Contacts API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Contacts
paths:
  /v1/contacts:
    get:
      description: 'Retrieve all contacts in your workspace''s contacts database. Contacts represent people such as interview participants, customers, or research subjects.


        Results can be filtered by name and sorted by creation date or name. They are paginated.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: List contacts
      tags:
      - Contacts
      parameters:
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: filter
        in: query
        description: Filter results based on the contact name.
        style: deepObject
        schema:
          type: object
          properties:
            name:
              type: object
              properties:
                contains:
                  type: string
                  description: Substring (case-insensitive) to search for within the target string
                equal_to:
                  type: string
                  description: Equal to operator
              description: Filter results based on string value. You can either provide a `contains` operator for substring matching or an `equal_to` operator for exact matching. These options are mutually exclusive.
          additionalProperties: false
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: created_at:desc
          oneOf:
          - type: string
            enum:
            - created_at:asc
            - created_at:desc
            - name:asc
            - name:desc
          - type: array
            items:
              type: string
              enum:
              - created_at:asc
              - created_at:desc
              - name:asc
              - name:desc
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type: string
                          description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                        name:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                                description: The field's label (name). Must match an existing field label when updating, or will create a new field when creating.
                              value:
                                oneOf:
                                - type: string
                                - type: boolean
                                - type: number
                                - type: array
                                  items:
                                    type: string
                                description: 'The field''s value. Type depends on the field type: string for TEXT/EMAIL/URL/PHONE, boolean for BOOLEAN, number for NUMBER/NPS, string (ISO 8601) for DATETIME, string array for SELECT, or string (contact name) for PERSON. Null to clear the value.'
                              type:
                                type: string
                                enum:
                                - BOOLEAN
                                - DATETIME
                                - EMAIL
                                - NPS
                                - NUMBER
                                - PERSON
                                - PHONE
                                - SELECT
                                - TEXT
                                - URL
                                description: Include the desired type when creating a new field. If omitted or left empty, the field type defaults to TEXT. Do not include this property when referencing an existing field.
                            required:
                            - label
                            - value
                      required:
                      - id
                      - name
                      - created_at
                      - fields
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
                    required:
                    - total_count
                    - has_more
                    - next_cursor
                required:
                - data
                - page
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - ValidationError
                        title:
                          type: string
                          enum:
                          - Contract violation
                        message:
                          type: string
                        path:
                          type: string
                      required:
                      - code
                      - title
                      - message
                      - path
                required:
                - errors
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - Unauthorized
                        title:
                          type: string
                        message:
                          type: string
                      required:
