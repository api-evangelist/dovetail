    post:
      description: 'Create a new contact in your workspace''s contacts database. Provide a name and email, and optionally attach custom field data (e.g. a Salesforce ID or company name).


        Contacts can later be linked to data entries and highlights within Dovetail to track which research insights came from which participants.


        Returns the newly created contact object.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create contact
      tags:
      - Contacts
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 1000
                  description: The contact’s name.
                  example: John Smith
                email:
                  type: string
                  format: email
                  description: The contact’s email.
                  example: john@dovetail.com
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        description: The field's label (name). Must match an existing field label when updating, or will create a new field when creating.
                      value:
