                      project_id:
                        type: string
                      workspace_tag_board:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          title:
                            type: string
                        required:
                        - id
                        - title
                        description: The workspace tag board this tag belongs to. Present only when `scope` is `workspace`; `null` for project tags. Use the board `id` as `tag_board_id` when creating workspace tags.
                      group:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          title:
                            type: string
                        required:
                        - id
                        - title
                        description: The group this tag belongs to within its tag board.
                      created_at:
                        type: string
                    required:
                    - id
                    - title
                    - scope
                    - project_id
                    - workspace_tag_board
                    - group
                    - created_at
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
