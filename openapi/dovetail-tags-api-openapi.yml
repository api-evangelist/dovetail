openapi: 3.2.0
info:
  title: Dovetail Public Tags API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Tags
paths:
  /v1/tags:
    get:
      description: 'Retrieve all tags in your workspace. Tags are labels used to categorize highlights during qualitative analysis (e.g. "Usability Issue", "Feature Request", "Positive Feedback"). Each tag is either a project tag (belonging to a single project) or a workspace tag (belonging to a workspace tag board and usable across all projects linked to that board) — see the `scope` field on each tag.


        Results can be filtered by project and tag board, and sorted by creation date. They are paginated.'
      summary: List tags
      tags:
      - Tags
      parameters:
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: created_at:desc
          oneOf:
          - type: string
            enum:
            - created_at:asc
            - created_at:desc
          - type: array
            items:
              type: string
              enum:
              - created_at:asc
              - created_at:desc
      - name: filter
        in: query
        description: See [Filters](https://developers.dovetail.com/docs/filters) for details on parameter formatting.
        style: deepObject
        schema:
          type: object
          properties:
            project_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) of the associated project(s)
            tag_board_id:
              type: string
              description: Filter to tags on this tag board. With `project_id`, the board must belong to that project; without `project_id`, the board must be a workspace tag board. Discover board IDs via **List tag boards**.
          additionalProperties: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type: string
                          description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                        title:
                          type: string
                        scope:
                          type: string
                          enum:
                          - project
                          - workspace
                          description: '`project` — the tag belongs to the project identified by `project_id`. `workspace` — the tag belongs to a workspace tag board and can be applied across all projects linked to that board; `project_id` then identifies the board''s extension project, which is not listed by the projects endpoints.'
                        project_id:
                          type: string
                        workspace_tag_board:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                          required:
                          - id
                          - title
                          description: The workspace tag board this tag belongs to. Present only when `scope` is `workspace`; `null` for project tags. Use the board `id` as `tag_board_id` when creating workspace tags.
                        group:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                          required:
                          - id
                          - title
                          description: The group this tag belongs to within its tag board.
                        created_at:
                          type: string
                      required:
                      - id
                      - title
                      - scope
                      - project_id
                      - workspace_tag_board
                      - group
                      - created_at
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
                    required:
                    - total_count
                    - has_more
                    - next_cursor
                required:
                - data
                - page
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - InvalidOperation
                          title:
                            type: string
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - ValidationError
                          title:
                            type: string
                            enum:
                            - Contract violation
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                        - message
                        - path
                required:
                - errors
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - Unauthorized
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '403':
          description: '403'
          content:
