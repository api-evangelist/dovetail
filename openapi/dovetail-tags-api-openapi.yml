    post:
      description: 'Create a new tag. Tags are labels used to categorize highlights — for example "Usability Issue", "Feature Request", or "Positive Feedback".


        Pass `project_id` to create a project tag in that project. Omit it to create a workspace tag on a workspace tag board — workspace tags can be applied to highlights in every project linked to that board. Creating workspace tags requires a plan with workspace tags enabled.


        By default the tag is created in the first group of the first tag board in the project or workspace. Pass `tag_board_id` and/or `group_id` to target a specific board or group (discover IDs via **List tag boards**). If the workspace has no tag board, create one in the Dovetail web app first.


        Once created, the tag can be applied to highlights using the **Create transcript highlight** endpoint or in the Dovetail web app.


        Returns the newly created tag object.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create tag
      tags:
      - Tags
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The tag's title.
                  example: Usability Issue
                project_id:
                  type: string
                  description: Unique identifier of the project to create the tag in. When provided, a project tag is created in that project; when omitted, a workspace tag is created on a workspace tag board, usable across all projects linked to that board.
                tag_board_id:
                  type: string
                  description: Unique identifier of the tag board to create the tag in. With `project_id`, the board must belong to that project; without `project_id`, the board must be a workspace tag board. Defaults to the first board in the project or workspace. Discover board IDs via **List tag boards**.
                group_id:
                  type: string
                  description: Unique identifier of the tag group to create the tag in. The group must belong to the resolved tag board. Defaults to the board's first group. Discover group IDs via **List tag boards**.
              required:
              - title
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                      title:
