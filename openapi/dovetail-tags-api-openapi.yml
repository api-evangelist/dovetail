  /v1/tags/{tag_id}:
    get:
      description: 'Retrieve a single tag by its unique identifier. Returns the tag''s title, scope (`project` or `workspace`), the project it belongs to, its workspace tag board (for workspace tags), and its creation date.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Get tag
      tags:
      - Tags
      parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the tag.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                      title:
                        type: string
                      scope:
                        type: string
                        enum:
                        - project
                        - workspace
                        description: '`project` — the tag belongs to the project identified by `project_id`. `workspace` — the tag belongs to a workspace tag board and can be applied across all projects linked to that board; `project_id` then identifies the board''s extension project, which is not listed by the projects endpoints.'
                      project_id:
                        type: string
                      workspace_tag_board:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          title:
                            type: string
                        required:
