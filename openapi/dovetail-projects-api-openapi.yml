    post:
      description: 'Create a new project in your Dovetail workspace. Projects are the primary container for organizing research — they hold data, docs, highlights, tags, and insights.


        Optionally provide a `template_id` to create the project from an existing workspace template. The new project will inherit the template''s fields, views, tags, and other structural elements. Retrieve available templates using the **List project templates** (`GET /v1/projects/templates`) endpoint.


        Optionally provide a `folder_id` to create the project inside an existing folder. If omitted, the project is created at the workspace root level.


        Returns the newly created project object.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create project
      tags:
      - Projects
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: The project's title.
                  example: My First Project
                template_id:
                  type: string
                  description: The ID of a workspace template to use when creating the project. The new project will be pre-populated with the template's fields, views, and structure.
                  example: 1A2B3C4D5E6F7G8H9I0J1K
                folder_id:
                  type: string
                  description: The ID of a folder to create the project inside. If omitted, the project is created at the workspace root level.
                  example: 1A2B3C4D5E6F7G8H9I0J1K
      responses:
