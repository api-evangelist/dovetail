  /v1/projects/{project_id}:
    get:
      description: 'Retrieve a single project by its unique identifier. Returns the project''s metadata including title, author, creation date, folder location, and overview content in Markdown format.


        Use this endpoint to fetch details about a specific project, for example to display project information or verify a project exists before creating content within it.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Get project
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the project.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
