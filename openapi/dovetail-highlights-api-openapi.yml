openapi: 3.2.0
info:
  title: Dovetail Public Highlights API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Highlights
paths:
  /v1/highlights:
    get:
      description: 'Retrieve all highlights in your workspace. Highlights are selected passages of text (or time ranges in audio/video transcripts) within data entries that have been marked as significant during qualitative analysis. They can be tagged with one or more tags to categorize findings.


        Results can be filtered by project, tag, specific highlight ID, creation date, or update date. **Only one** of `project_id`, `tag_id`, or `highlight_id` can be used per request. Results are sortable by creation date and are paginated.'
      summary: List highlights
      tags:
      - Highlights
      parameters:
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: created_at:desc
          oneOf:
          - type: string
            enum:
            - created_at:asc
            - created_at:desc
          - type: array
            items:
              type: string
              enum:
              - created_at:asc
              - created_at:desc
      - name: filter
        in: query
        description: You may only use one of project_id, tag_id or highlight_id as a filter parameter. See [Filters](https://developers.dovetail.com/docs/filters) for details on parameter formatting.
        schema:
          type: object
          properties:
            created_at:
              type: object
              properties:
                gt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Great than operator
                gte:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Great than or equal to operator
                lt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Less than operator
                lte:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Less than or equal operator
              description: Filter results based on dates. When passing in operators, the operator pairs are mutually exclusive. For example, you cannot send both `gt` and `gte` in the same request.
            updated_at:
              type: object
              properties:
                gt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Great than operator
                gte:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Great than or equal to operator
                lt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Less than operator
                lte:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Less than or equal operator
              description: Filter results based on dates. When passing in operators, the operator pairs are mutually exclusive. For example, you cannot send both `gt` and `gte` in the same request.
            project_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) of the associated project(s)
            highlight_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) of the associated highlight(s)
            tag_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) for associated tag(s)
          additionalProperties: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type:
                          - string
                          - 'null'
                          description: The URL of the parent note containing this highlight in the Dovetail web app. This field is experimental and may change without notice.
                        note_id:
                          type:
                          - string
                          - 'null'
                        tags:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                            required:
                            - id
                            - title
                        text:
                          type:
                          - string
                          - 'null'
                        type:
                          type: string
                          enum:
                          - highlight
                        start_time:
                          type:
                          - number
                          - 'null'
                        end_time:
                          type:
                          - number
                          - 'null'
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - note_id
                      - tags
                      - text
                      - type
                      - start_time
                      - end_time
                      - created_at
                      - updated_at
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
                    required:
                    - total_count
                    - has_more
                    - next_cursor
                required:
                - data
                - page
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - ValidationError
                        title:
                          type: string
                          enum:
                          - Contract violation
                        message:
                          type: string
                        path:
                          type: string
                      required:
                      - code
                      - title
                      - message
                      - path
                required:
                - errors
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - Unauthorized
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '403':
          description: '403'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - Forbidden
                          title:
                            type: string
                          message:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - IpNotAllowlisted
                          title:
                            type: string
                          message:
                            type: string
                          decisionId:
                            type: string
                            description: Correlation id quoting this enforcement decision — include it when contacting support.
                        required:
                        - code
                        - title
                        - decisionId
                required:
                - errors
        '404':
          description: '404'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - NotFound
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '422':
          description: '422'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - UnprocessableContent
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                      - message
                required:
                - errors
        '429':
          description: '429'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - TooManyRequests
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '500':
          description: '500'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - InternalError
                        title:
                          type: string
                          enum:
                          - Internal server error
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
      operationId: getV1Highlights
      x-operation-id-source: derived
    post:
      description: 'Create a highlight on a transcript by specifying start and end timestamps in seconds.


        The data entry (referenced by `note_id`) must contain an audio or video transcript for the highlight to be created.

        If the entry contains multiple audio/video elements, the first transcript is used.


        **Tip:** to get word-level timestamps for picking `start_time` and `end_time`, pair this endpoint with **Export data** (`GET /v1/data/:data_id/export/html`). The HTML export wraps each transcript word in a `` carrying `data-monologue-start-time` and `data-monologue-end-time` attributes; the markdown export only includes paragraph-level timestamps. Bounds are snapped to the nearest word, so `start_time` / `end_time` returned by **Get highlight** / **List highlights** can be sent back here unchanged.


        Returns the created highlight.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create transcript highlight
      tags:
      - Highlights
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                note_id:
                  type: string
                  description: Unique identifier of the data entry (note) containing the transcript.
                start_time:
                  type: number
                  minimum: 0
                  description: Start time in seconds within the transcript to begin the highlight.
                  example: 10.5
                end_time:
                  type: number
                  minimum: 0
                  description: End time in seconds within the transcript to end the highlight.
                  example: 25.3
                tag_ids:
                  type: array
                  items:
                    type: string
                  description: Optional list of tag IDs to associate with the highlight.
              required:
              - note_id
              - start_time
              - end_time
      responses:
