  /v1/highlights/{highlight_id}/tags:
    post:
      description: 'Apply one or more tags (up to 10 per request) to a highlight. Tags are labels used to categorize highlights during qualitative analysis (e.g. "Usability Issue", "Feature Request").


        Each tag must belong to the highlight''s project, or to a workspace tag board linked to that project. Discover tag IDs via **List tags** (or create one via **Create tag**) and highlight IDs via **List highlights**.


        If any tag ID is invalid or does not belong to the highlight''s project, the request fails and no tags are applied — the response names the offending tag IDs. Applying a tag the highlight already has is a no-op.


        Only highlights on data entries can be tagged: a range carried by a doc/insight, or one that is an inline comment rather than a highlight, is rejected with a 400 and will never become taggable — do not retry it. Returns the updated highlight, including its full tag list.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Apply tags to highlight
      tags:
      - Highlights
      parameters:
      - name: highlight_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the highlight.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 10
                  description: Unique identifiers of the tags to apply to the highlight. At most 10 tags can be applied per request.
              required:
              - tag_ids
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type:
                        - string
                        - 'null'
                        description: The URL of the parent note containing this highlight in the Dovetail web app. This field is experimental and may change without notice.
                      note_id:
                        type:
                        - string
                        - 'null'
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                          required:
                          - id
                          - title
                      text:
                        type:
                        - string
                        - 'null'
                      type:
                        type: string
                        enum:
                        - highlight
                      start_time:
                        type:
                        - number
                        - 'null'
                      end_time:
                        type:
                        - number
                        - 'null'
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - note_id
                    - tags
                    - text
                    - type
                    - start_time
                    - end_time
                    - created_at
                    - updated_at
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - InvalidOperation
                          title:
                            type: string
                          message:
                            type: string
                          path:
                            type: string
                        required:
