  /v1/channels/data:
    post:
      description: 'Send a new data point to a channel for automated AI analysis. Each data point represents a single piece of customer feedback (e.g. an app review, a support ticket, or an NPS response).


        The `text` field contains the content to analyze, and `timestamp` records when the feedback was originally received (in ISO 8601 format). You can optionally attach `source_title` and `source_url` to track provenance, and include `metadata` key-value pairs for additional context.


        Once created, Dovetail will automatically classify the data point against the channel''s topics.


        Returns the data point object without the text content.'
      summary: Create data point
      tags:
      - Channels
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000000
                  description: The data point's content, used to analyze and classify the data point.
                  example: Support email requesting a trial for Dovetail app.
                channel_id:
                  type: string
                  description: Unique identifier of the channel that the data point is associated with.
                timestamp:
                  type: string
                  description: The data point's timestamp in ISO8601 format.
                source_title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The title of the original source from which this data point was extracted.
                source_url:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: The URL of the original source from which this data point was extracted.
                metadata:
                  type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                      maxLength: 100
                    - type: number
                    - type: boolean
                    - type: array
                      items:
                        type: string
                        maxLength: 100
                    - type:
                      - string
                      - 'null'
                      format: 'null'
                  description: Optional key-value metadata to be included with the data point.
              required:
              - text
              - channel_id
              - timestamp
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                      channel:
