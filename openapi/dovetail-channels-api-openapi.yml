                        title:
                          type: string
                        type:
                          type: string
                          enum:
                          - channel
                        created_at:
                          type: string
                        deleted:
                          type: boolean
                        folder:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                          required:
                          - id
                      required:
                      - id
                      - title
                      - type
                      - created_at
                      - deleted
                      - folder
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
