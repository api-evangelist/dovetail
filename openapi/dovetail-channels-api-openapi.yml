    get:
      description: 'Retrieve all channels in your workspace. Channels are automated analysis pipelines that continuously process high-volume unstructured customer feedback (e.g. app reviews, NPS responses, support tickets) into structured, categorized insights using AI-powered topic classification.


        Results can be filtered by folder and sorted by creation date or title. They are paginated.'
      summary: List channels
      tags:
      - Channels
      parameters:
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: filter
        in: query
        description: See [Filters](https://developers.dovetail.com/docs/filters) for details on parameter formatting.
        style: deepObject
        schema:
          type: object
          properties:
            folder_id:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
              description: Unique identifier(s) of the associated folder(s)
          additionalProperties: false
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: created_at:desc
          oneOf:
          - type: string
            enum:
            - created_at:asc
            - created_at:desc
            - title:asc
            - title:desc
          - type: array
            items:
              type: string
              enum:
              - created_at:asc
              - created_at:desc
              - title:asc
              - title:desc
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type: string
