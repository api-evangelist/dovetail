openapi: 3.2.0
info:
  title: Dovetail Public Channels API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Channels
paths:
  /v1/channels:
    post:
      description: 'Create a new channel in your workspace. A channel is an automated pipeline for analyzing customer feedback at scale. You must specify a `content_type` (e.g. `APP_REVIEW`, `NPS_FEEDBACK`, `SUPPORT_TICKETS`) that tells Dovetail what kind of data will flow through this channel.


        Optionally place the channel in a folder via `project_category_id`.


        Once created, send data to the channel using the **Create data point** (`POST /v1/channels/data`) endpoint. Dovetail will automatically classify each data point into topics.


        Returns the channel object with its initial set of AI-generated topics.'
      summary: Create channel
      tags:
      - Channels
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The channel's title.
                content_type:
                  type: string
                  enum:
                  - APP_REVIEW
                  - CHURN_REASONS
                  - NPS_FEEDBACK
                  - PRODUCT_REVIEW
                  - SUPPORT_TICKETS
                  description: 'The channel''s content type. Possible values: [APP_REVIEW, CHURN_REASONS, NPS_FEEDBACK, PRODUCT_REVIEW, SUPPORT_TICKETS]'
                project_category_id:
                  type: string
                  description: Unique identifier of the folder you want to save this channel.
              required:
              - title
              - content_type
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this resource in the Dovetail web app. This field is experimental and may change without notice.
                      title:
                        type: string
                      project_category:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                        required:
                        - id
                      created_at:
                        type: string
                      topics:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                          required:
                          - id
                          - title
                          - description
                    required:
                    - id
                    - title
                    - project_category
                    - created_at
                    - topics
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - InvalidOperation
                          title:
                            type: string
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - ValidationError
                          title:
                            type: string
                            enum:
                            - Contract violation
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
