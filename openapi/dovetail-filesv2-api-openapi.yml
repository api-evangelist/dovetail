  /v2/files/{file_id}/upload/complete:
    post:
      description: 'Finalize an upload session created by **Initiate single-PUT upload** (`POST /v2/files/upload`). The server `HEAD`s the S3 object to confirm bytes are present and that the size matches the declared value, then flips the file row to `DONE`.


        On success the file is marked as uploaded and returned in the response. The file''s processing `status` may still be `pending` while downstream processing runs.


        Idempotent for already-DONE files: a retry of a previously-successful complete call (or a complete call arriving after the auto-finalize backstop has already finalised the row) returns `200` with the file metadata instead of `409`. `FAILED` / `CANCELLED` still return `409`.


        To cancel an in-progress upload, simply stop calling the API: abandoned file records are garbage-collected after 24 hours.'
      summary: Finalize a single-PUT file upload
      tags:
      - FilesV2
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File id
        description: Unique identifier of the file.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties: {}
              description: Finalize a single-PUT upload. The endpoint takes no body parameters.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the file.
                      name:
                        type: string
                        description: The file's original name.
                      type:
                        type:
                        - string
                        - 'null'
                        description: The file's MIME type (e.g. 'image/png', 'video/mp4'). Null if unknown.
                      size:
                        type:
                        - number
                        - 'null'
                        description: Size of the file in bytes. Null if unknown.
                      status:
                        type: string
                        enum:
                        - completed
                        - pending
                        - failed
                        description: Processing status of the file. 'pending' while being processed, 'completed' when ready, or 'failed' if processing encountered an error.
                      author:
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                          required:
                          - id
                        - type:
                          - string
                          - 'null'
                          format: 'null'
                        description: The user who uploaded the file, or null if the author is unknown.
                      created_at:
                        oneOf:
                        - type: string
                        - type:
                          - string
                          - 'null'
