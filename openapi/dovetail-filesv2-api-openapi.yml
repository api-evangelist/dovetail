  /v2/files/{file_id}/large-upload/complete:
    post:
      description: 'Finalize an upload session created by **Initiate large upload** (`POST /v2/files/large-upload`). The `parts` array must include every part that was uploaded, with the `etag` returned by the storage backend for each part `PUT`.


        On success the file is marked as uploaded and returned in the response. The file''s processing `status` may still be `pending` while downstream processing runs. A `502` response indicates the storage backend rejected the finalization (for example, a part `etag` mismatch) — the client may retry.


        Idempotent for already-DONE files: a retry of a previously-successful complete call (or a complete call arriving after the auto-finalize backstop has already finalised the row) returns `200` with the file metadata instead of `409`. `FAILED` / `CANCELLED` still return `409`.


        To cancel an in-progress upload, simply stop calling the API: abandoned file records are garbage-collected after 24 hours, and any incomplete S3 multipart parts are reaped by an S3 bucket lifecycle rule.'
      summary: Finalize a large (multipart) file upload
      tags:
      - FilesV2
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File id
        description: Unique identifier of the file.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                upload_id:
                  type: string
                  minLength: 1
                  description: Multipart `upload_id` returned by the large-upload initiate endpoint.
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      part_number:
                        type: integer
                        minimum: 1
                        maximum: 10000
                        description: 1-indexed part number that was uploaded.
                      etag:
                        type: string
                        minLength: 1
                        description: ETag returned by the storage backend when the part was uploaded.
                    required:
                    - part_number
                    - etag
                  minItems: 1
                  maxItems: 10000
                  description: All uploaded parts, with their `part_number` and `etag`. Must include every part that was uploaded.
              required:
              - upload_id
              - parts
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the file.
                      name:
                        type: string
                        description: The file's original name.
                      type:
                        type:
                        - string
                        - 'null'
                        description: The file's MIME type (e.g. 'image/png', 'video/mp4'). Null if unknown.
                      size:
                        type:
                        - number
                        - 'null'
                        description: Size of the file in bytes. Null if unknown.
                      status:
                        type: string
                        enum:
                        - completed
                        - pending
                        - failed
                        description: Processing status of the file. 'pending' while being processed, 'completed' when ready, or 'failed' if processing encountered an error.
                      author:
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                          required:
                          - id
                        - type:
                          - string
                          - 'null'
                          format: 'null'
                        description: The user who uploaded the file, or null if the author is unknown.
                      created_at:
                        oneOf:
                        - type: string
                        - type:
                          - string
                          - 'null'
                          format: 'null'
                        description: ISO 8601 timestamp when the file was created.
                      url:
                        type:
                        - string
                        - 'null'
                        description: Permanent URL pointing at the **Download a file** endpoint. Safe to cache and store — the URL itself never expires, but calling it requires the same authentication as other API endpoints and returns a short-lived presigned URL each time. The endpoint performs its own readiness and access checks.
                    required:
                    - id
                    - name
                    - type
                    - size
                    - status
                    - author
                    - created_at
                    - url
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
