                        description: Pre-signed URL the client should `PUT` the file body to.
                      expires_at:
                        type: string
                        description: ISO 8601 timestamp at which `upload_url` expires.
                      max_file_size_bytes:
                        type: number
                        enum:
                        - 5000000000
                        description: Maximum size (bytes) accepted by this endpoint.
                    required:
                    - file_id
                    - upload_url
                    - expires_at
                    - max_file_size_bytes
                required:
                - data
