openapi: 3.2.0
info:
  title: Dovetail Public Files V2 API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: FilesV2
paths:
  /v2/files/large-upload:
    post:
      description: 'Initiate a multipart upload for files **up to 10 GB**. The response includes an opaque `upload_id` and a fully populated `urls` array containing one pre-signed `PUT` URL per part the client should upload. After uploading every part, call **Complete large upload** at `POST /v2/files/{file_id}/large-upload/complete` with the resulting part `etag` values.


        The client may optionally specify the desired number of `parts` (1 to 10000). If omitted, the server picks a value based on the declared `size` and the recommended part size — for most uploads this is the right default.


        Every URL in `urls` expires roughly **3 hours** after issue. If a part `PUT` fails after that window, abandon the upload and initiate a fresh session.


        Once finalized, inspect the file with `GET /v1/files/{file_id}` and download it with `GET /v1/files/{file_id}/download` — no v2 read surface exists yet.


        Returns `201` with the upload session details. Orphaned uploads that are not completed are eventually cleaned up.'
      summary: Initiate a large (multipart) file upload
      tags:
      - FilesV2
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: The file's original name, including extension. 1-1024 characters.
                type:
                  type: string
                  maxLength: 255
                  description: The file's MIME type (e.g. `image/png`, `video/mp4`). Up to 255 characters.
                size:
                  type: integer
                  minimum: 1
                  maximum: 10000000000
                  description: Total size of the file in bytes. Must be between 1 and 10000000000 (10 GB).
                parts:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Number of parts the client will split the upload into. Optional — if omitted, the server picks a value based on the declared `size` and the recommended part size. Must be between 1 and 10000.
              required:
              - name
              - type
              - size
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      file_id:
                        type: string
                        description: Base62-encoded UUID identifying the newly created file record.
                      upload_id:
                        type: string
                        description: Opaque identifier for the multipart upload. Pass this back to the large-upload complete endpoint.
                      urls:
                        type: array
                        items:
                          type: object
                          properties:
                            part_number:
                              type: integer
                              minimum: 1
                              maximum: 10000
                              description: 1-indexed part number this URL corresponds to.
                            url:
                              type: string
                              format: uri
                              description: Pre-signed URL the client should `PUT` the part body to.
                            expires_at:
                              type: string
                              description: ISO 8601 timestamp at which this part URL expires.
                          required:
                          - part_number
                          - url
                          - expires_at
                        minItems: 1
                        maxItems: 10000
                        description: Signed `PUT` URLs for every part of the upload, ordered by `part_number` ascending. The array length equals the number of parts the server allocated for this session.
                      part_size_recommendation:
                        type: object
                        properties:
                          min:
                            type: number
                            enum:
                            - 5242880
                            description: Minimum part size (bytes). All parts except the last must be at least this size.
                          recommended:
                            type: number
                            enum:
                            - 26214400
                            description: Recommended part size (bytes). Balances throughput and request overhead.
                          max:
                            type: number
                            enum:
                            - 5368709120
                            description: Maximum part size (bytes). No single part may exceed this value.
                        required:
                        - min
                        - recommended
                        - max
                        description: Server-recommended part-size bounds for the multipart upload.
                      max_parts:
                        type: number
                        enum:
                        - 10000
                        description: Maximum number of parts a large upload may use.
                      max_file_size_bytes:
                        type: number
                        enum:
                        - 10000000000
                        description: Maximum size (bytes) accepted by this endpoint.
                    required:
                    - file_id
                    - upload_id
                    - urls
                    - part_size_recommendation
                    - max_parts
                    - max_file_size_bytes
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - InvalidOperation
                        title:
                          type: string
                        message:
