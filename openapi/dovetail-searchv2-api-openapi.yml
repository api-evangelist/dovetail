                                  to: {}
                                required:
                                - from
                                - to
                            required:
                            - option
                            - range
                      required:
                      - method
                      - value
                      description: Filter by a date range.
                    archived:
                      default: false
                      type: boolean
                      description: Whether to include archived items in the results.
                    sort:
                      default:
                        by: RELEVANCE
                        direction: DESC
                      type: object
                      properties:
                        by:
                          type: string
                          enum:
                          - RELEVANCE
                          - CREATED
                          - UPDATED
                        direction:
                          type: string
                          enum:
                          - DESC
                          - ASC
                      required:
                      - by
                      - direction
                      description: Sort the search results by a specific field and direction (ASC or DESC).
              required:
              - options
              additionalProperties: false
