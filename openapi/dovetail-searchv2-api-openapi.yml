                              - type: object
                                properties:
                                  option:
                                    type: string
                                    enum:
                                    - custom
                                  range:
                                    type: object
                                    properties:
                                      from: {}
                                      to: {}
                                    required:
                                    - from
                                    - to
                                required:
                                - option
                                - range
                          required:
                          - id
                          - type
                          - method
                          - value
                        - type: object
                          properties:
                            id:
                              type: string
                              description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                            type:
                              type: string
                              enum:
                              - BOOLEAN
                            method:
                              type: string
                              enum:
                              - CONTAINS
                              - NOT_CONTAINS
                            value:
                              type: boolean
                          required:
                          - id
                          - type
                          - method
                          - value
                        - type: object
                          properties:
                            id:
                              type: string
                              description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                            type:
                              type: string
                              enum:
                              - NUMBER
                            method:
                              type: string
                              enum:
                              - EQUAL
                              - NOT_EQUAL
                              - GREATER_THAN
                              - LESS_THAN
                            value:
                              type: number
                          required:
                          - id
                          - type
                          - method
                          - value
                      description: Filter by custom fields.
                    date:
                      default:
                        method: CREATED
                        value:
                          option: allTimeNoRange
                      type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - CREATED
