                                type: string
                          required:
                          - id
                          - type
                          - method
                          - value
                        - type: object
                          properties:
                            id:
                              type: string
                              description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                            type:
                              type: string
                              enum:
                              - DATE
                            method:
                              type: string
                              enum:
                              - CONTAINS
                              - NOT_CONTAINS
                            value:
                              oneOf:
                              - type: object
                                properties:
                                  option:
                                    type: string
                                    enum:
