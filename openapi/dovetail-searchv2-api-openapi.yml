openapi: 3.2.0
info:
  title: Dovetail Public Search V2 API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: SearchV2
paths:
  /v2/search:
    post:
      description: 'Perform an advanced search across your entire Dovetail workspace. This is the recommended search endpoint, supporting all content types: agents, highlights, data (notes), insights, channels, dashboards, tags, themes, projects, folders, and people (contacts).


        **Filtering options:**


        - **`types`** — Restrict results to specific content types (defaults to all types).

        - **`query`** — Full-text search string matched against titles and content.

        - **`location`** — Scope results to specific projects or folders using their IDs.

        - **`user`** — Filter by contributor or author.

        - **`tags`** / **`themes`** — Filter by tag or theme IDs.

        - **`people`** — Filter by contacts (people) mentioned in content.

        - **`fields`** — Filter by custom field values.

        - **`date`** — Filter by creation date range.

        - **`archived`** — Include archived items (default: `false`).


        Results can be sorted by relevance (default) or other criteria, and are paginated using `offset` and `limit` (default 20, max 100). Each content type is returned in its own array within the response.'
      summary: Search V2
      tags:
      - SearchV2
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                offset:
                  default: 0
                  type: integer
                  minimum: 0
                  description: The number of items to skip before starting to collect the result set.
                limit:
                  default: 20
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: The number of items to return.
                options:
                  type: object
                  properties:
                    types:
                      default:
                      - AGENT
                      - CHANNEL
                      - DASHBOARD
                      - FOLDER
                      - HIGHLIGHT
                      - INSIGHT
                      - NOTE
                      - PERSON
                      - PROJECT
                      - TAG
                      - THEME
                      type: array
                      items:
                        type: string
                        enum:
                        - AGENT
                        - CHANNEL
                        - DASHBOARD
                        - FOLDER
                        - HIGHLIGHT
                        - INSIGHT
                        - NOTE
                        - PERSON
                        - PROJECT
                        - TAG
                        - THEME
                      description: The types of objects to include in the search results. Defaults to all available types if not provided.
                    query:
                      default: ''
                      type: string
                      maxLength: 512
                      description: The search query string. Must be at most 512 characters long.
                    location:
                      default:
                        method: LOCATED_IN
                        value: []
                      type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - LOCATED_IN
                          - NOT_LOCATED_IN
                        value:
                          type: array
                          items:
                            type: string
                            description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                      required:
                      - method
                      - value
                      description: Filter by location by project or folder IDs
                    user:
                      default:
                        method: CONTRIBUTED_BY
                        value: []
                      type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - CONTRIBUTED_BY
                          - NOT_CONTRIBUTED_BY
                          - CONTRIBUTOR_IDS
                          - CREATED_BY
                          - NOT_CREATED_BY
                        value:
                          type: array
                          items:
                            type: string
                            description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                        aiContributed:
                          type: boolean
                      required:
                      - method
                      - value
                      description: Filter by user who contributed or authored the object.
                    tags:
                      default: []
                      type: array
                      items:
                        type: object
                        properties:
                          method:
                            type: string
                            enum:
                            - ALL
                            - CONTAINS
                            - IS_NOT_ONE_OF
                            - IS_ALL_OF
                            - IS_NOT_ALL_OF
                            - IS_EMPTY
                            - IS_NOT_EMPTY
                          value:
                            type: array
                            items:
                              type: string
                              description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                        required:
                        - method
                        - value
                      description: Filter by tag IDs.
                    themes:
                      default: []
                      type: array
                      items:
                        type: object
                        properties:
                          method:
                            type: string
                            enum:
                            - ALL
                            - CONTAINS
                            - IS_NOT_ONE_OF
                            - IS_ALL_OF
                            - IS_NOT_ALL_OF
                            - IS_EMPTY
                            - IS_NOT_EMPTY
                          value:
                            type: array
                            items:
                              type: string
                              description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                        required:
                        - method
                        - value
                      description: Filter by theme IDs.
                    people:
                      default:
                        method: CONTAINS
                        value: []
                      type: object
                      properties:
                        method:
                          type: string
                          enum:
                          - CONTAINS
                        value:
                          type: array
                          items:
                            type: string
                            description: Base62-encoded UUID (22 characters), as returned by other public API endpoints.
                      required:
                      - method
                      - value
                      description: Filter by person IDs mentioned in the content.
                    fields:
                      default: []
                      type: array
                      items:
                        discriminator:
                          propertyName: type
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
