      - name: include_file_content
        in: query
        description: 'When `true`, the response additionally includes the extracted text of attached document files (PDF, DOCX, PPTX, XLSX) read from the search index: `content_text`, `files` (with per-file `text_status`), `indexed`, and `truncated`. Defaults to `false`.'
        schema:
