openapi: 3.2.0
info:
  title: Dovetail Public Datasets API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Datasets
paths:
  /v1/dataset/{dataset_id}/data:
    post:
      description: 'Send a new data point to a dataset, without it having to belong to a channel.


        A dataset is one connection under a source — the same thing shown as a dataset in the Dovetail UI. Sending data here lets a push-based source (such as the API or Zapier) ingest before any channel subscribes to it. Field values are captured against the source as the data arrives, so once a channel does subscribe, the data is already filterable.


        No `url` is returned. Until a channel subscribes to the source, the data point has no page in Dovetail to link to.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create data point on a dataset
      tags:
      - Datasets
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the dataset, shown as a dataset under its source in Dovetail. Accepts the short form shown in the UI or the plain uuid.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000000
                  description: The data point's content, used to analyze and classify the data point.
                  example: Support email requesting a trial for Dovetail app.
                timestamp:
                  type: string
                  description: The data point's timestamp in ISO8601 format.
                source_title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: The title of the original source from which this data point was extracted.
                source_url:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: The URL of the original source from which this data point was extracted.
                email:
                  type: string
                  maxLength: 320
                  format: email
                  description: Email of the person this data point is from. When the source creates contacts, the data point is linked to that contact, creating it if needed. Returns 400 if invalid.
                  example: jane@example.com
                metadata:
                  type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                      maxLength: 100
                    - type: number
                    - type: boolean
                    - type: array
                      items:
                        type: string
                        maxLength: 100
                    - type:
                      - string
                      - 'null'
                      format: 'null'
                  description: Optional key-value metadata to be included with the data point.
              required:
              - text
              - timestamp
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the data point.
                      dataset:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier of the dataset.
                        required:
                        - id
                      timestamp:
                        type: string
                        description: The data point's timestamp in ISO8601 format.
                      created_at:
                        type: string
                        description: When the data point was created, in ISO8601 format.
                    required:
                    - id
                    - dataset
                    - timestamp
                    - created_at
                required:
                - data
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - InvalidOperation
                          title:
                            type: string
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - ValidationError
                          title:
                            type: string
                            enum:
                            - Contract violation
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                        - message
                        - path
                required:
                - errors
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - Unauthorized
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '403':
          description: '403'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - Forbidden
                          title:
                            type: string
                          message:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - IpNotAllowlisted
                          title:
                            type: string
                          message:
                            type: string
                          decisionId:
                            type: string
                            description: Correlation id quoting this enforcement decision — include it when contacting support.
                        required:
                        - code
                        - title
                        - decisionId
                required:
                - errors
        '404':
          description: '404'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - NotFound
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '422':
          description: '422'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - UnprocessableContent
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                      - message
                required:
                - errors
        '429':
          description: '429'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - TooManyRequests
                        title:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - title
                required:
                - errors
        '500':
          description: '500'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - InternalError
                      title:
                        type: string
                        enum:
                        - Internal server error
                      message:
                        type: string
                    required:
                    - code
                    - title
                required:
                - errors
      operationId: postV1DatasetByDatasetIdData
      x-operation-id-source: derived
