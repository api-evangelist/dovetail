  /v1/files/{file_id}/download:
    get:
      description: 'Get a presigned URL to download the content of a file by its unique identifier.


        The response includes a short-lived URL that can be used to download the file directly from cloud storage without additional authentication. The URL is valid for 1 hour; call this endpoint again to mint a fresh URL when needed.


        Download availability is based on upload completion and redaction/obfuscation readiness. It is separate from processing status: a file can still report `pending` or `failed` from the **Get file by id** endpoint while the original bytes are available for download.'
      summary: Download a file
      tags:
      - Files
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File id
        description: Unique identifier of the file.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        description: Short-lived presigned URL pointing at cloud storage. Fetch this URL with no extra authentication to download the file bytes. Valid for 1 hour.
                      expires_at:
                        type: string
                        description: ISO 8601 timestamp when the presigned URL expires.
                        format: date-time
                    required:
                    - url
