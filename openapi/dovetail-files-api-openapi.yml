  /v1/files/{file_id}:
    get:
      description: 'Retrieve metadata for a single file by its unique identifier. Returns the file''s name, MIME type, size in bytes, processing status (`pending`, `completed`, or `failed`), author, and creation date.


        Files are attachments (images, documents, audio, video) that can be embedded in docs, data entries, or other content. Use this endpoint to check a file''s processing status after upload.'
      summary: Get file by id
      tags:
      - Files
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File id
        description: Unique identifier of the file.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
