  /v1/users/{user_id}:
    get:
      description: 'Retrieve a single workspace member by their unique identifier. Returns the user''s profile information including name, email, job title, role (CONTRIBUTOR, MANAGER, or VIEWER), and whether they are a workspace admin.


        Use this endpoint to look up details about a specific team member — for example, to display author information or resolve user IDs returned by other endpoints.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Get user
      tags:
      - Users
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the user.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        description: The URL of this user in the Dovetail web app.
                      name:
                        type:
                        - string
