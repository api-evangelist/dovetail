      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The folder's title.
                  example: My Folder
                parent_folder_id:
                  type: string
                  description: The ID of the parent folder. If omitted, the folder is created at the root level.
