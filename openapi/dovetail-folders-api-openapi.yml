    post:
      description: 'Create a new folder in your Dovetail workspace. Folders organize projects, docs, channels, and other content into a hierarchical structure.


        Optionally provide a `parent_folder_id` to nest the folder inside an existing folder. If omitted, the folder is created at the workspace root level.


        Returns the newly created folder object.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
