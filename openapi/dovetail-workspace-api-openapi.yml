  /v1/workspace/context/docs:
    post:
      description: 'Add an insight to the workspace''s AI context. A workspace can have at most 10 context docs. If the insight is already linked, this is a no-op.


        Requires a workspace administrator.


        Returns the full updated list of context docs.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Add workspace context doc
      tags:
      - Workspace
      parameters: []
