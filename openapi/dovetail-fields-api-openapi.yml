openapi: 3.2.0
info:
  title: Dovetail Public Fields API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: Fields
paths:
  /v1/fields:
    get:
      description: 'Get a list of fields for a project or workspace field group.


        You must provide either `project_id` or `workspace_field_group_id` in the filter, along with `field_set_type` (`data` or `doc`).'
      summary: List fields
      tags:
      - Fields
      parameters:
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: rank:asc
          oneOf:
          - type: string
            enum:
            - rank:asc
            - rank:desc
            - created_at:asc
            - created_at:desc
          - type: array
            items:
              type: string
              enum:
              - rank:asc
              - rank:desc
              - created_at:asc
              - created_at:desc
      - name: filter
        in: query
        description: See [Filters](https://developers.dovetail.com/docs/filters) for details on parameter formatting.
        required: true
        schema:
          type: object
          properties:
            project_id:
              type: string
              description: Unique identifier of the project.
            workspace_field_group_id:
              type: string
              description: Unique identifier of the workspace field group.
            field_set_type:
              type: string
              enum:
              - data
              - doc
              description: 'Filter by field set type: ''data'' or ''doc''.'
          required:
          - field_set_type
          additionalProperties: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                          - field
                        label:
                          type: string
                        field_type:
                          type: string
                          enum:
                          - ARR
                          - BOOLEAN
                          - CSAT
                          - DATETIME
                          - EMAIL
                          - MULTI_SELECT
                          - NPS
                          - NUMBER
                          - PERSON
                          - PHONE
                          - RATING
                          - SINGLE_SELECT
                          - TEXT
                          - URL
                        field_set_type:
                          type: string
                          enum:
                          - data
                          - doc
                        project_id:
                          type: string
                        rank:
                          type: number
                        options:
                          oneOf:
                          - type: array
                            items:
                              type: string
                          - type: object
                            properties:
                              format:
                                type:
                                - string
                                - 'null'
                              currency_symbol:
                                type:
                                - string
                                - 'null'
                        created_at:
                          type: string
                        deleted:
                          type: boolean
                      required:
                      - id
                      - type
                      - label
                      - field_type
                      - field_set_type
                      - project_id
                      - rank
                      - options
                      - created_at
                      - deleted
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
                    required:
                    - total_count
                    - has_more
                    - next_cursor
                required:
                - data
                - page
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - InvalidOperation
                          title:
                            type: string
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                      - type: object
                        properties:
                          code:
                            type: string
                            enum:
                            - ValidationError
                          title:
                            type: string
                            enum:
                            - Contract violation
                          message:
                            type: string
                          path:
                            type: string
                        required:
                        - code
                        - title
                        - message
                        - path
                required:
                - errors
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - Unauthorized
                        title:
                          type: string
                        message:
                          type: string
                      required:
