    post:
      description: 'Create a field in a project or workspace field group.


        You must provide either `project_id` or `workspace_field_group_id`, along with `field_set_type`.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create field
      tags:
      - Fields
      parameters: []
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                  description: Unique identifier of the project to create the field in.
                workspace_field_group_id:
                  type: string
                  description: Unique identifier of the workspace field group to create the field in.
                field_set_type:
                  type: string
                  enum:
                  - data
                  - doc
                  description: Whether to create the field in the 'data' or 'doc' field set.
                label:
                  type: string
                  minLength: 1
                  maxLength: 250
                  description: The field label.
                  example: Company Name
                type:
                  type: string
                  enum:
                  - ARR
                  - BOOLEAN
                  - CSAT
                  - DATETIME
                  - EMAIL
                  - MULTI_SELECT
                  - NPS
                  - NUMBER
                  - PERSON
                  - PHONE
                  - RATING
                  - SINGLE_SELECT
                  - TEXT
                  - URL
                  description: The field type.
                  example: TEXT
                options:
                  oneOf:
                  - type: array
                    items:
                      type: string
                      minLength: 1
                      maxLength: 250
                    minItems: 1
                    description: Available options for a SINGLE_SELECT or MULTI_SELECT field.
                    example:
                    - Option A
                    - Option B
                  - type: object
                    properties:
                      format:
                        type: string
                        enum:
                        - number
                        - number_with_commas
                        - percent
                        - currency
                        description: Display format for the number.
                      currency_symbol:
                        type: string
                        maxLength: 10
                        description: Currency symbol when format is 'currency'.
                        example: $
                    additionalProperties: false
                  description: Type-specific options for the field. Required for SINGLE_SELECT and MULTI_SELECT fields.
                rank:
                  type: number
                  description: Position of the field in the list. If omitted, appended to the end.
              required:
              - field_set_type
              - label
              - type
