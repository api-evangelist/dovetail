openapi: 3.2.0
info:
  title: Dovetail Public Insight Comments API
  version: 0.0.1
  description: The Dovetail Public API provides programmatic access to your Dovetail workspace.
servers:
- url: https://dovetail.com/api
- url: https://dovetailapp.com/api
security:
- bearerAuth: []
tags:
- name: InsightComments
paths:
  /v1/insights/{insight_id}/comments:
    get:
      description: 'Get a list of page-level and inline comments on an insight.


        Pass `?include_text_range=true` to include the selected text and surrounding context for inline comments. By default the list returns comment text only.


        Comments are returned in chronological order by default. Only published comments are included.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: List insight comments
      deprecated: true
      tags:
      - InsightComments
      parameters:
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the insight.
      - name: page
        in: query
        description: See [Pagination](https://developers.dovetail.com/docs/pagination) for details about how to use a cursor to iterate through the list.
        style: deepObject
        schema:
          default:
            limit: 100
          type: object
          properties:
            start_cursor:
              type: string
            limit:
              default: 100
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
      - name: sort
        in: query
        description: See [Sort](https://developers.dovetail.com/docs/sort) for details on the sort parameter.
        schema:
          default: created_at:asc
          type: string
          enum:
          - created_at:asc
          - created_at:desc
      - name: include_text_range
        in: query
        description: When `true`, inline comments include `text_range` with the selected text and surrounding context. Defaults to `false`.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type: string
                          description: The URL of the doc this comment belongs to in the Dovetail web app.
                        body:
                          type: string
                        author:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                          required:
                          - id
                          - name
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        comment_type:
                          type: string
                          enum:
                          - page
                          - inline
                          description: 'The type of comment: "page" for page-level comments, "inline" for comments on text selections.'
                        thread_id:
                          type: string
                          description: Identifier of the comment thread. Comments that share a thread_id are replies in the same conversation.
                        text_range:
                          type:
                          - object
                          - 'null'
                          properties:
                            text:
                              type: string
                              description: The selected text that this inline comment is attached to.
                            text_before:
                              type:
                              - string
                              - 'null'
                              description: Text context before the selection.
                            text_after:
                              type:
                              - string
                              - 'null'
                              description: Text context after the selection.
                          required:
                          - text
                          - text_before
                          - text_after
                          description: The selected text and surrounding context for inline comments. Present on POST, GET, PATCH, and DELETE of a single comment. On list, omitted unless `include_text_range=true`. Null for page-level comments when included.
                      required:
                      - id
                      - body
                      - author
                      - created_at
                      - updated_at
                      - comment_type
                      - thread_id
                  page:
                    type: object
                    properties:
                      total_count:
                        type: number
                        description: Total number of items matching the query.
                      has_more:
                        type: boolean
                        description: Whether there are more items beyond the current page.
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor to pass as `page[start_cursor]` to fetch the next page. Null when there are no more results.
                    required:
                    - total_count
                    - has_more
                    - next_cursor
                  thread:
                    type:
                    - object
                    - 'null'
                    properties:
                      resolved:
                        type: boolean
                      resolved_at:
                        type:
                        - string
                        - 'null'
                      resolved_by:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                        required:
                        - id
                        - name
                    required:
                    - resolved
                    - resolved_at
                    - resolved_by
                    description: The page-level comment thread status. Null if no page-level thread exists.
                required:
                - data
                - page
                - thread
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - ValidationError
                        title:
                          type: string
                          enum:
