    post:
      description: 'Create a comment on an insight.


        If no page-level comment thread exists on the insight, one will be created automatically unless `thread_id` is set. Pass `thread_id` from list or get comments to append a reply to that page-level or inline thread. The comment is attributed to the authenticated user.


        > 🚧 Permissions

        >

        > Please check you have the relevant permissions required to access this resource. This may include specific permissions on the object itself or its parent, or having the correct user role if you''re making updates.'
      summary: Create insight comment
      deprecated: true
      tags:
      - InsightComments
      parameters:
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the insight.
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  maxLength: 10000
                  description: The comment content. Interpreted according to body_type (defaults to plain text).
                  example: Great insight! We should follow up on this.
                body_type:
                  default: text
                  type: string
                  enum:
                  - text
                  - html
                  description: Format of the body field. Defaults to "text". Use "html" for rich text content.
                author_id:
                  type: string
                  description: Workspace user to attribute this comment to. **Workspace admins only** — useful when importing comments from another tool. The target user must be an active member of the same workspace. If omitted, the comment is attributed to the authenticated user. When an admin sets this field, the author change is recorded in workspace audit logs with the API user as the actor, so overrides remain traceable. Once set, only the target user can edit or delete the comment.
                created_at:
                  type: string
                  description: ISO 8601 datetime to set as the comment's creation date. Only workspace admins can use this field. If omitted, defaults to the current time. Can only be set at creation time. When an admin sets this field, the timestamp change is recorded in workspace audit logs with the API user as the actor, so overrides remain traceable.
                  example: '2024-01-15T10:30:00Z'
                  format: date-time
                published_at:
                  type: string
                  description: ISO 8601 datetime to set as the comment's publication date. This is the timestamp shown in the Dovetail UI for the comment. Only workspace admins can use this field. If omitted, defaults to the current time. Can only be set at creation time. Must be >= created_at and not in the future. When an admin sets this field, the timestamp change is recorded in workspace audit logs with the API user as the actor, so overrides remain traceable.
                  example: '2024-01-15T10:30:00Z'
                  format: date-time
                thread_id:
                  type: string
                  description: Existing comment thread on this doc. When set, the comment is appended to that page-level or inline thread. When omitted, posts on the page-level thread.
              required:
              - body
